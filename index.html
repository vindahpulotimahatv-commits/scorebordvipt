<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPT SCOREBOARD - Broadcast Graphics</title>
    <!-- Font Roboto -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { navy: '#0f172a', red: '#dc2626', silver: '#cbd5e1', dark: '#1e293b' }
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --team-a-color: #dc2626;
            --team-b-color: #2563eb;
            --bg-glass: rgba(15, 23, 42, 0.9);
            --border-silver: #94a3b8;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Roboto', sans-serif; overflow: hidden; background-color: #0f172a;
        }
        body.mode-output { background: transparent !important; }
        .scoreboard-root {
            width: 1920px; height: 1080px; position: absolute; top: 0; left: 0;
            pointer-events: none; display: flex; justify-content: center;
        }
        #preview-container {
            position: relative; width: 100%; height: 100%;
            background-image: linear-gradient(45deg, #1e293b 25%, transparent 25%), 
                              linear-gradient(-45deg, #1e293b 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #1e293b 75%), 
                              linear-gradient(-45deg, transparent 75%, #1e293b 75%);
            background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            overflow: hidden; border-radius: 0.5rem; border: 1px solid #334155;
        }
        .sb-main-bar {
            margin-top: 55px; display: flex; align-items: stretch; height: 70px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); border-radius: 8px; overflow: visible;
            border: 2px solid rgba(255,255,255,0.1); background: var(--bg-glass);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .sb-event-logo {
            padding: 5px 20px; background: #ffffff; display: flex; align-items: center;
            justify-content: center; border-top-left-radius: 6px; border-bottom-left-radius: 6px;
            border-right: 3px solid var(--border-silver);
        }
        .sb-event-logo img { max-height: 50px; max-width: 100px; object-fit: contain; }
        .sb-team { display: flex; align-items: center; padding: 0 20px; min-width: 280px; position: relative; overflow: hidden; }
        .sb-team::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.5) 100%); z-index: 0;
        }
        .sb-team-a { background-color: var(--team-a-color); justify-content: flex-end; }
        .sb-team-b { background-color: var(--team-b-color); justify-content: flex-start; }
        .sb-team-name {
            font-size: 32px; font-weight: 700; color: #ffffff; z-index: 1;
            text-transform: uppercase; letter-spacing: 1px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); white-space: nowrap;
        }
        .sb-team-logo { height: 50px; width: 50px; object-fit: contain; z-index: 1; filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.5)); }
        .sb-team-a .sb-team-logo { margin-left: 15px; }
        .sb-team-b .sb-team-logo { margin-right: 15px; }
        .sb-score-box {
            background: #000000; display: flex; align-items: center; justify-content: center;
            min-width: 80px; font-size: 46px; font-weight: 900; color: #ffffff;
            border-left: 1px solid #333; border-right: 1px solid #333;
            text-shadow: 0px 0px 10px rgba(255,255,255,0.3); font-variant-numeric: tabular-nums;
        }
        .sb-center { display: flex; flex-direction: column; justify-content: center; align-items: center; min-width: 220px; background: var(--bg-glass); position: relative; }
        .sb-timer { font-size: 36px; font-weight: 900; color: #fbbf24; letter-spacing: 2px; font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(251, 191, 36, 0.5); line-height: 1; margin-top: 5px; }
        .sb-period { font-size: 14px; font-weight: 700; color: var(--border-silver); text-transform: uppercase; letter-spacing: 3px; margin-top: 2px; }
        .sb-live { position: absolute; top: -15px; background: #dc2626; color: white; font-size: 12px; font-weight: 900; padding: 2px 10px; border-radius: 10px; letter-spacing: 2px; animation: pulse-live 2s infinite; }
        @keyframes pulse-live { 0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); } 70% { box-shadow: 0 0 0 6px rgba(220, 38, 38, 0); } 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); } }
        @keyframes score-pop { 0% { transform: scale(1); color: white; } 50% { transform: scale(1.4); color: #fbbf24; } 100% { transform: scale(1); color: white; } }
        .anim-pop { animation: score-pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        #custom-modal { display: none; backdrop-filter: blur(5px); }
        #custom-modal.active { display: flex; }
        #btn-back-operator { position: fixed; top: 20px; left: 20px; z-index: 9999; background: #dc2626; color: white; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; display: none; border: 2px solid white; }
    </style>
</head>
<body class="text-white">

    <button id="btn-back-operator" onclick="exitTestOutput()">⬅ KEMBALI KE OPERATOR (ESC)</button>

    <!-- UI OPERATOR PANEL -->
    <div id="operator-view" class="hidden h-screen flex flex-col bg-brand-navy">
        <header class="bg-brand-dark border-b border-gray-700 p-4 flex justify-between items-center shrink-0">
            <div>
                <h1 class="text-2xl font-black tracking-wider text-white">VIPT<span class="text-brand-red">SCOREBOARD</span></h1>
                <p class="text-xs text-green-400 tracking-widest uppercase font-bold">● MULTI-USER CLOUD • ROOM: <span id="room-label">-</span></p>
            </div>
            <div class="flex items-center gap-4">
                <label class="flex items-center gap-2 cursor-pointer bg-gray-800 px-4 py-2 rounded border border-gray-600">
                    <input type="checkbox" id="inp-transparent" class="w-4 h-4 rounded text-blue-600" onchange="toggleTransparent()">
                    <span class="text-sm font-bold">TRANSPARENT OUTPUT</span>
                </label>
                <button onclick="copyControlLink()" class="bg-emerald-600 hover:bg-emerald-500 px-5 py-2 rounded font-black shadow-lg">SALIN LINK KONTROL</button>
                <button onclick="copyOutputLink()" class="bg-purple-600 hover:bg-purple-500 px-5 py-2 rounded font-black shadow-lg">SALIN LINK OUTPUT</button>
                <button onclick="testFullOutput()" class="bg-blue-600 hover:bg-blue-500 px-5 py-2 rounded font-black shadow-lg">TEST OUTPUT</button>
                <button onclick="openOutput()" class="bg-brand-red hover:bg-red-700 px-6 py-2 rounded font-black shadow-lg">BUKA TAB OUTPUT</button>
            </div>
        </header>

        <div class="flex flex-1 overflow-hidden">
            <div class="w-[500px] bg-gray-800 border-r border-gray-700 flex flex-col shrink-0">
                <div class="flex-1 overflow-y-auto p-6 space-y-6">
                    <!-- Pengaturan Olahraga & Periode -->
                    <div class="grid grid-cols-2 gap-4 bg-gray-900 p-4 rounded-lg border border-gray-700">
                        <div>
                            <label class="block text-xs font-bold text-gray-400 mb-1">SPORT</label>
                            <select id="inp-sport" onchange="updateSport()" class="w-full bg-gray-800 border border-gray-600 rounded p-2 text-white font-bold outline-none">
                                <option value="FUTSAL">FUTSAL</option>
                                <option value="VOLLEYBALL">VOLLEYBALL</option>
                                <option value="BADMINTON">BADMINTON</option>
                                <option value="BASKETBALL">BASKETBALL</option>
                                <option value="CUSTOM">CUSTOM</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-400 mb-1">PERIODE</label>
                            <div class="flex gap-2">
                                <select id="inp-period-select" onchange="updatePeriodFromSelect()" class="w-full bg-gray-800 border border-gray-600 rounded p-2 text-white font-bold outline-none">
                                    <option value="BABAK 1">BABAK 1</option>
                                    <option value="BABAK 2">BABAK 2</option>
                                    <option value="SET 1">SET 1</option>
                                    <option value="SET 2">SET 2</option>
                                    <option value="CUSTOM">CUSTOM...</option>
                                </select>
                                <input type="text" id="inp-period-custom" oninput="updatePeriodCustom()" class="hidden w-full bg-gray-800 border border-gray-600 rounded p-2 text-white font-bold" placeholder="Ketik...">
                            </div>
                        </div>
                    </div>

                    <!-- Tim A & B -->
                    <div class="grid grid-cols-2 gap-6">
                        <div class="bg-gray-900 p-4 rounded-lg border border-gray-700 relative overflow-hidden">
                            <div class="absolute top-0 left-0 w-full h-1 bg-brand-red" id="indicator-color-a"></div>
                            <label class="block text-xs font-bold text-gray-400 mb-2">TIM A (KIRI)</label>
                            <input type="text" id="inp-name-a" oninput="updateTeamData()" class="w-full bg-gray-800 border border-gray-600 rounded p-2 text-white font-black text-xl mb-3 text-center uppercase" value="RT 08">
                            <div class="flex items-center gap-2 mb-4">
                                <input type="color" id="inp-color-a" onchange="updateTeamData()" class="w-10 h-10 rounded cursor-pointer border-none p-0" value="#dc2626">
                                <label class="flex-1 cursor-pointer bg-gray-800 border border-gray-600 rounded p-2 text-center text-xs font-bold">LOGO<input type="file" class="hidden" accept="image/*" onchange="handleImageUpload(event, 'teamA')"></label>
                            </div>
                            <div class="flex justify-between items-center bg-black p-2 rounded">
                                <button onclick="changeScore('A', -1)" class="w-12 h-12 bg-gray-800 hover:bg-red-900 rounded text-2xl font-black">−</button>
                                <span id="op-score-a" class="text-5xl font-black">0</span>
                                <button onclick="changeScore('A', 1)" class="w-12 h-12 bg-gray-800 hover:bg-green-900 rounded text-2xl font-black">+</button>
                            </div>
                        </div>
                        <div class="bg-gray-900 p-4 rounded-lg border border-gray-700 relative overflow-hidden">
                            <div class="absolute top-0 left-0 w-full h-1 bg-blue-600" id="indicator-color-b"></div>
                            <label class="block text-xs font-bold text-gray-400 mb-2">TIM B (KANAN)</label>
                            <input type="text" id="inp-name-b" oninput="updateTeamData()" class="w-full bg-gray-800 border border-gray-600 rounded p-2 text-white font-black text-xl mb-3 text-center uppercase" value="RT 07">
                            <div class="flex items-center gap-2 mb-4">
                                <input type="color" id="inp-color-b" onchange="updateTeamData()" class="w-10 h-10 rounded cursor-pointer border-none p-0" value="#2563eb">
                                <label class="flex-1 cursor-pointer bg-gray-800 border border-gray-600 rounded p-2 text-center text-xs font-bold">LOGO<input type="file" class="hidden" accept="image/*" onchange="handleImageUpload(event, 'teamB')"></label>
                            </div>
                            <div class="flex justify-between items-center bg-black p-2 rounded">
                                <button onclick="changeScore('B', -1)" class="w-12 h-12 bg-gray-800 hover:bg-red-900 rounded text-2xl font-black">−</button>
                                <span id="op-score-b" class="text-5xl font-black">0</span>
                                <button onclick="changeScore('B', 1)" class="w-12 h-12 bg-gray-800 hover:bg-green-900 rounded text-2xl font-black">+</button>
                            </div>
                        </div>
                    </div>

                    <button onclick="promptResetScore()" class="w-full bg-gray-800 hover:bg-gray-700 border border-gray-600 text-gray-300 py-2 rounded font-bold text-sm">RESET SKOR</button>

                    <!-- Timer -->
                    <div class="bg-gray-900 p-4 rounded-lg border border-gray-700 text-center">
                        <label class="block text-xs font-bold text-gray-400 mb-2">TIMER PERTANDINGAN</label>
                        <div class="text-5xl font-black text-amber-400 mb-4 font-mono tracking-wider" id="op-timer-display">10:00</div>
                        <div class="grid grid-cols-3 gap-2 mb-4">
                            <button onclick="modifyTimer(-60)" class="bg-gray-800 rounded py-1 text-sm font-bold border border-gray-600">-1 M</button>
                            <button onclick="modifyTimer(-10)" class="bg-gray-800 rounded py-1 text-sm font-bold border border-gray-600">-10 S</button>
                            <button onclick="promptResetTimer()" class="bg-gray-800 rounded py-1 text-sm font-bold border border-gray-600 text-red-400">RESET</button>
                            <button onclick="modifyTimer(60)" class="bg-gray-800 rounded py-1 text-sm font-bold border border-gray-600">+1 M</button>
                            <button onclick="modifyTimer(10)" class="bg-gray-800 rounded py-1 text-sm font-bold border border-gray-600">+10 S</button>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="startTimer()" id="btn-timer-start" class="flex-1 bg-green-600 hover:bg-green-500 text-white py-3 rounded font-black text-lg">START</button>
                            <button onclick="pauseTimer()" id="btn-timer-pause" class="flex-1 bg-amber-600 hover:bg-amber-500 text-white py-3 rounded font-black text-lg hidden">PAUSE</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Preview Panel -->
            <div class="flex-1 bg-black p-8 flex flex-col">
                <div class="flex justify-between items-center mb-4 shrink-0">
                    <h2 class="text-xl font-bold flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-red-600 animate-pulse"></span>LIVE PREVIEW</h2>
                </div>
                <div class="flex-1 flex items-center justify-center min-h-0">
                    <div id="preview-container"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- TEMPLATE SCOREBOARD -->
    <div id="scoreboard-template" style="display: none;">
        <div class="scoreboard-root" id="sb-root">
            <div class="sb-main-bar">
                <div class="sb-event-logo" id="ui-event-box" style="display: none;"><img id="ui-event-img" src="" alt=""></div>
                <div class="sb-team sb-team-a" id="ui-team-a-bg">
                    <div class="sb-team-name" id="ui-team-a-name">TEAM A</div>
                    <img id="ui-team-a-logo" class="sb-team-logo" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" style="display:none;">
                </div>
                <div class="sb-score-box" id="ui-score-a">0</div>
                <div class="sb-center">
                    <div class="sb-live" id="ui-live-badge">LIVE</div>
                    <div class="sb-timer" id="ui-timer">10:00</div>
                    <div class="sb-period" id="ui-period">BABAK 1</div>
                </div>
                <div class="sb-score-box" id="ui-score-b">0</div>
                <div class="sb-team sb-team-b" id="ui-team-b-bg">
                    <img id="ui-team-b-logo" class="sb-team-logo" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" style="display:none;">
                    <div class="sb-team-name" id="ui-team-b-name">TEAM B</div>
                </div>
            </div>
        </div>
    </div>

    <div id="output-view" class="hidden h-screen w-screen overflow-hidden relative"></div>

    <!-- MODAL -->
    <div id="custom-modal" class="fixed inset-0 z-50 bg-black/80 items-center justify-center">
        <div class="bg-gray-900 border border-gray-700 rounded-lg p-6 max-w-sm w-full shadow-2xl">
            <h3 id="modal-title" class="text-xl font-black text-white mb-2">Title</h3>
            <p id="modal-message" class="text-gray-400 text-sm mb-6">Message...</p>
            <div class="flex justify-end gap-3">
                <button onclick="closeModal()" class="px-4 py-2 bg-gray-800 rounded text-sm font-bold">BATAL</button>
                <button id="modal-confirm-btn" class="px-4 py-2 bg-brand-red rounded text-sm font-bold">YA</button>
            </div>
        </div>
    </div>

    <!-- FIREBASE & CORE SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, onSnapshot, runTransaction } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        /*
         * GITHUB + FIREBASE CONFIG
         * Paste the Web App config from:
         * Firebase Console -> Project settings -> Your apps -> Web app
         */
        const firebaseConfig = {
            apiKey: "PASTE_API_KEY",
            authDomain: "PASTE_PROJECT_ID.firebaseapp.com",
            projectId: "PASTE_PROJECT_ID",
            storageBucket: "PASTE_PROJECT_ID.firebasestorage.app",
            messagingSenderId: "PASTE_MESSAGING_SENDER_ID",
            appId: "PASTE_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Room ID comes from ?room=NAMA_ROOM. Example: ?room=viptcup1
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = (urlParams.get("room") || "vipcup4")
            .toLowerCase()
            .replace(/[^a-z0-9_-]/g, "-")
            .slice(0, 40) || "vipcup4";

        const roomRef = doc(db, "scoreboard_rooms", roomId);

        let state = {
            sport: 'FUTSAL',
            period: 'BABAK 1',
            timer: 600,
            timerRunning: false,
            teamA: { name: 'RT 08', score: 0, logo: '', color: '#dc2626' },
            teamB: { name: 'RT 07', score: 0, logo: '', color: '#2563eb' },
            eventLogo: '',
            transparentMode: false
        };

        let isOutputMode = false;
        let timerInterval = null;
        let isCloudUpdating = false;

        async function initApp() {
            isOutputMode = urlParams.get('mode') === 'output';

            try {
                await signInAnonymously(auth);
            } catch(e) {
                console.error("Firebase Auth error:", e);
                showFirebaseError(e);
            }

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    setupCloudSync();
                }
            });

            if (isOutputMode) {
                initOutputMode();
            } else {
                initOperatorMode();
            }
        }

        function showFirebaseError(error) {
            const msg = (error && error.message) ? error.message : "Firebase belum dikonfigurasi.";
            const banner = document.createElement("div");
            banner.style.cssText = "position:fixed;z-index:99999;top:0;left:0;right:0;background:#991b1b;color:#fff;padding:12px 16px;font:700 14px Arial;text-align:center";
            banner.textContent = "FIREBASE ERROR: " + msg + " | Isi firebaseConfig di index.html dan aktifkan Anonymous Auth + Firestore.";
            document.body.appendChild(banner);
        }

        function setupCloudSync() {
            if (!auth.currentUser) return;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'scoreboard_state_v2');
            
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (!isCloudUpdating) {
                        state = data;
                        renderScoreboard();
                        if (!isOutputMode) populateUI();
                    }
                } else {
                    setDoc(docRef, state);
                }
            }, (error) => {
                console.error("Cloud sync error:", error);
            });
        }

        async function syncToCloud() {
            if (!auth.currentUser) return;
            isCloudUpdating = true;
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'scoreboard_state_v2');
                await setDoc(docRef, state);
            } catch(e) {
                console.error("Gagal menyimpan ke cloud", e);
            }
            setTimeout(() => { isCloudUpdating = false; }, 200);
        }

        function initOperatorMode() {
            const opView = document.getElementById('operator-view');
            if(opView) opView.classList.remove('hidden');
            const previewContainer = document.getElementById('preview-container');
            if(previewContainer) {
                previewContainer.innerHTML = document.getElementById('scoreboard-template').innerHTML;
            }
            window.addEventListener('resize', resizePreview);
            resizePreview();
            setupHotkeys();
        }

        function initOutputMode() {
            const outView = document.getElementById('output-view');
            if(outView) outView.classList.remove('hidden');
            document.body.classList.add('mode-output');
            const outputView = document.getElementById('output-view');
            if(outputView) {
                outputView.innerHTML = document.getElementById('scoreboard-template').innerHTML;
            }
            renderScoreboard();
            applyTransparentMode();
        }

        window.testFullOutput = function() {
            document.getElementById('operator-view').classList.add('hidden');
            document.getElementById('output-view').classList.remove('hidden');
            document.getElementById('btn-back-operator').style.display = 'block';
            document.body.classList.add('mode-output');
            isOutputMode = true;
            document.getElementById('output-view').innerHTML = document.getElementById('scoreboard-template').innerHTML;
            renderScoreboard();
            applyTransparentMode();
        }

        window.exitTestOutput = function() {
            document.getElementById('operator-view').classList.remove('hidden');
            document.getElementById('output-view').classList.add('hidden');
            document.getElementById('btn-back-operator').style.display = 'none';
            document.body.classList.remove('mode-output', 'transparent-on');
            isOutputMode = false;
            renderScoreboard();
            resizePreview();
        }

        window.renderScoreboard = function() {
            const rootId = isOutputMode ? 'output-view' : 'preview-container';
            const root = document.getElementById(rootId);
            if (!root) return;

            const setVal = (id, val) => { const el = root.querySelector('#' + id); if(el) el.textContent = val; };
            const setCSS = (id, prop, val) => { const el = root.querySelector('#' + id); if(el) el.style[prop] = val; };
            const setSrc = (id, src) => { const el = root.querySelector('#' + id); if(el) { if(src) { el.src = src; el.style.display = 'block'; } else { el.style.display = 'none'; } } };

            setVal('ui-team-a-name', state.teamA.name);
            setVal('ui-team-b-name', state.teamB.name);
            setVal('ui-period', state.period);
            state.timer = getLiveTimerValue();\n            setVal('ui-timer', formatTime(state.timer));

            const elScoreA = root.querySelector('#ui-score-a');
            const elScoreB = root.querySelector('#ui-score-b');
            if (elScoreA && parseInt(elScoreA.textContent) !== state.teamA.score) {
                elScoreA.textContent = state.teamA.score;
                elScoreA.classList.remove('anim-pop'); void elScoreA.offsetWidth; elScoreA.classList.add('anim-pop');
            }
            if (elScoreB && parseInt(elScoreB.textContent) !== state.teamB.score) {
                elScoreB.textContent = state.teamB.score;
                elScoreB.classList.remove('anim-pop'); void elScoreB.offsetWidth; elScoreB.classList.add('anim-pop');
            }

            setCSS('ui-team-a-bg', 'backgroundColor', state.teamA.color);
            setCSS('ui-team-b-bg', 'backgroundColor', state.teamB.color);
            setSrc('ui-team-a-logo', state.teamA.logo);
            setSrc('ui-team-b-logo', state.teamB.logo);

            const liveBadge = root.querySelector('#ui-live-badge');
            if(liveBadge) liveBadge.style.display = state.timerRunning ? 'block' : 'none';

            if (!isOutputMode) {
                const opA = document.getElementById('op-score-a');
                const opB = document.getElementById('op-score-b');
                if(opA) opA.textContent = state.teamA.score;
                if(opB) opB.textContent = state.teamB.score;
                const opTimer = document.getElementById('op-timer-display');
                if(opTimer) opTimer.textContent = formatTime(state.timer);
                
                const btnStart = document.getElementById('btn-timer-start');
                const btnPause = document.getElementById('btn-timer-pause');
                if(btnStart && btnPause) {
                    btnStart.style.display = state.timerRunning ? 'none' : 'block';
                    btnPause.style.display = state.timerRunning ? 'block' : 'none';
                }
            }
            if(isOutputMode) applyTransparentMode();
        }

        function resizePreview() {
            if (isOutputMode) return;
            const container = document.getElementById('preview-container');
            const root = container?.querySelector('.scoreboard-root');
            if (!container || !root) return;
            const scale = Math.min(container.clientWidth / 1920, container.clientHeight / 1080) * 0.95;
            root.style.transform = `scale(${scale})`;
            root.style.transformOrigin = 'center top';
            root.style.top = '10%';
        }

        window.populateUI = function() {
            const sp = document.getElementById('inp-sport'); if(sp) sp.value = state.sport;
            const na = document.getElementById('inp-name-a'); if(na) na.value = state.teamA.name;
            const ca = document.getElementById('inp-color-a'); if(ca) ca.value = state.teamA.color;
            const nb = document.getElementById('inp-name-b'); if(nb) nb.value = state.teamB.name;
            const cb = document.getElementById('inp-color-b'); if(cb) cb.value = state.teamB.color;
            const tr = document.getElementById('inp-transparent'); if(tr) tr.checked = state.transparentMode;
            const ps = document.getElementById('inp-period-select');
            const pc = document.getElementById('inp-period-custom');
            if (ps && pc) {
                const options = [...ps.options].map(o => o.value);
                if (options.includes(state.period)) {
                    ps.value = state.period; pc.classList.add('hidden');
                } else {
                    ps.value = 'CUSTOM'; pc.classList.remove('hidden'); pc.value = state.period || '';
                }
            }
        }

        window.changeScore = async function(team, amount) {
            // Optimistic local update for instant UI response.
            if (team === 'A') state.teamA.score = Math.max(0, state.teamA.score + amount);
            else state.teamB.score = Math.max(0, state.teamB.score + amount);
            renderScoreboard();
            await changeScoreCloud(team, amount);
        }

        window.updateTeamData = function() {
            state.teamA.name = document.getElementById('inp-name-a').value;
            state.teamA.color = document.getElementById('inp-color-a').value;
            state.teamB.name = document.getElementById('inp-name-b').value;
            state.teamB.color = document.getElementById('inp-color-b').value;
            updateAndSync();
        }

        window.updateSport = function() {
            state.sport = document.getElementById('inp-sport').value;
            updateAndSync();
        }

        window.updatePeriodFromSelect = function() {
            const select = document.getElementById('inp-period-select');
            const custom = document.getElementById('inp-period-custom');
            if (select.value === 'CUSTOM') {
                custom.classList.remove('hidden');
                state.period = custom.value || 'CUSTOM';
            } else {
                custom.classList.add('hidden');
                state.period = select.value;
            }
            updateAndSync();
        }

        window.updatePeriodCustom = function() {
            state.period = document.getElementById('inp-period-custom').value.toUpperCase();
            updateAndSync();
        }

        window.toggleTransparent = function() {
            state.transparentMode = document.getElementById('inp-transparent').checked;
            updateAndSync();
        }

        function applyTransparentMode() {
            if(state.transparentMode) document.body.classList.add('transparent-on');
            else document.body.classList.remove('transparent-on');
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function getLiveTimerValue() {
            if (state.timerRunning && state.timerEndAt) {
                return Math.max(0, Math.ceil((state.timerEndAt - Date.now()) / 1000));
            }
            return Math.max(0, Number(state.timer || 0));
        }

        function runLocalTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const remaining = getLiveTimerValue();
                state.timer = remaining;
                renderScoreboard();
                if (remaining <= 0 && state.timerRunning) {
                    state.timerRunning = false;
                    state.timerEndAt = null;
                    clearInterval(timerInterval);
                    syncToCloud({ timer: 0, timerRunning: false, timerEndAt: null });
                }
            }, 250);
        }

        window.startTimer = function() {
            const remaining = getLiveTimerValue();
            if (!state.timerRunning && remaining > 0) {
                state.timer = remaining;
                state.timerRunning = true;
                state.timerEndAt = Date.now() + remaining * 1000;
                runLocalTimer();
                syncToCloud({
                    timer: remaining,
                    timerRunning: true,
                    timerEndAt: state.timerEndAt
                });
            }
        }

        window.pauseTimer = function() {
            const remaining = getLiveTimerValue();
            state.timer = remaining;
            state.timerRunning = false;
            state.timerEndAt = null;
            clearInterval(timerInterval);
            renderScoreboard();
            syncToCloud({ timer: remaining, timerRunning: false, timerEndAt: null });
        }

        window.modifyTimer = function(amount) {
            const remaining = Math.max(0, getLiveTimerValue() + amount);
            state.timer = remaining;
            if (state.timerRunning) {
                state.timerEndAt = Date.now() + remaining * 1000;
                syncToCloud({ timer: remaining, timerRunning: true, timerEndAt: state.timerEndAt });
                runLocalTimer();
            } else {
                state.timerEndAt = null;
                updateAndSync();
            }
        }

        window.handleImageUpload = function(event, target) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 400;
                    let w = img.width, h = img.height;
                    if (w > h && w > MAX_SIZE) { h *= MAX_SIZE / w; w = MAX_SIZE; }
                    else if (h > MAX_SIZE) { w *= MAX_SIZE / h; h = MAX_SIZE; }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    const compressed = canvas.toDataURL('image/webp', 0.7);
                    if (target === 'teamA') state.teamA.logo = compressed;
                    else if (target === 'teamB') state.teamB.logo = compressed;
                    updateAndSync();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function updateAndSync() {
            renderScoreboard();
            syncToCloud();
        }

        window.openOutput = function() {
            const currentUrl = window.location.href.split('?')[0];
            window.open(currentUrl + '?mode=output&room=' + encodeURIComponent(roomId), '_blank', 'width=1920,height=1080');
        }

        window.copyControlLink = async function() {
            const url = window.location.origin + window.location.pathname + '?room=' + encodeURIComponent(roomId);
            try {
                await navigator.clipboard.writeText(url);
                alert("LINK KONTROL DISALIN:\n" + url);
            } catch {
                prompt("Salin link kontrol ini:", url);
            }
        }

        window.copyOutputLink = async function() {
            const url = window.location.origin + window.location.pathname + '?mode=output&room=' + encodeURIComponent(roomId);
            try {
                await navigator.clipboard.writeText(url);
                alert("LINK OUTPUT DISALIN:\n" + url);
            } catch {
                prompt("Salin link output ini:", url);
            }
        }

        function setupHotkeys() {
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && isOutputMode && !window.location.search.includes('mode=output')) {
                    exitTestOutput();
                    return;
                }
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || isOutputMode) return;
                const key = e.key.toUpperCase();
                if (key === 'A') changeScore('A', 1);
                else if (key === 'Z') changeScore('A', -1);
                else if (key === 'L') changeScore('B', 1);
                else if (key === 'M') changeScore('B', -1);
                else if (key === ' ' || key === 'SPACEBAR') {
                    e.preventDefault();
                    state.timerRunning ? pauseTimer() : startTimer();
                }
            });
        }

        let modalCallback = null;
        window.showModal = function(title, msg, btnText, cb) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = msg;
            document.getElementById('modal-confirm-btn').textContent = btnText;
            modalCallback = cb;
            document.getElementById('custom-modal').classList.add('active');
        }
        window.closeModal = function() {
            document.getElementById('custom-modal').classList.remove('active');
            modalCallback = null;
        }
        document.getElementById('modal-confirm-btn').addEventListener('click', () => {
            if(modalCallback) modalCallback();
            closeModal();
        });

        window.promptResetScore = function() {
            showModal("RESET SKOR?", "Kembalikan skor tim A dan B ke 0?", "RESET", () => {
                state.teamA.score = 0; state.teamB.score = 0;
                updateAndSync();
            });
        }
        window.promptResetTimer = function() {
            showModal("RESET TIMER?", "Atur ulang timer pertandingan?", "RESET", () => {
                pauseTimer(); state.timer = 600; state.timerEndAt = null;\n                updateAndSync();
            });
        }

        window.onload = initApp;
    </script>
</body>
</html>
